[package]
name = "cetz-dotnet-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[lib]
name = "cetz_dotnet_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typst = "=0.14.2"
typst-as-lib = { version = "=0.15.4", features = ["packages", "ureq", "typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-render = "=0.14.2"
typst-pdf = "=0.14.2"
typst-svg = "=0.14.2"
