name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version metadata and check native source
        id: metadata
        shell: pwsh
        run: |
          [xml]$versions = Get-Content eng/Versions.props
          $metadata = $versions.Project.PropertyGroup
          $fingerprint = ./eng/native-fingerprint.ps1
          "changed=$($fingerprint -ne $metadata.NativeSourceFingerprint)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          "rust-toolchain=$($metadata.RustToolchainVersion)" >> $env:GITHUB_OUTPUT
      - if: steps.metadata.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.metadata.outputs.rust-toolchain }}
          components: rustfmt, clippy
      - if: steps.metadata.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-verify-${{ steps.metadata.outputs.rust-toolchain }}-${{ hashFiles('Cargo.lock', 'native/typst-dotnet-native/**/*.rs', 'native/typst-dotnet-native/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-verify-${{ steps.metadata.outputs.rust-toolchain }}-
      - if: steps.metadata.outputs.changed == 'true'
        run: cargo fmt --all -- --check
      - if: steps.metadata.outputs.changed == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: steps.metadata.outputs.changed == 'true'
        run: cargo test --workspace --locked

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            library: typst_dotnet_native.dll
          - os: ubuntu-latest
            rid: linux-x64
            library: libtypst_dotnet_native.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version metadata
        id: metadata
        shell: pwsh
        run: |
          [xml]$versions = Get-Content eng/Versions.props
          $metadata = $versions.Project.PropertyGroup
          "native-tag=native-v$($metadata.NativeVersion)" >> $env:GITHUB_OUTPUT
          "rust-toolchain=$($metadata.RustToolchainVersion)" >> $env:GITHUB_OUTPUT
      - name: Restore pinned native binary
        id: native-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force 'artifacts/native/${{ matrix.rid }}' | Out-Null
          gh release download '${{ steps.metadata.outputs.native-tag }}' `
            --repo '${{ github.repository }}' `
            --pattern '${{ matrix.library }}' `
            --dir 'artifacts/native/${{ matrix.rid }}'
          $restored = $LASTEXITCODE -eq 0
          if ($restored) {
            gh release download '${{ steps.metadata.outputs.native-tag }}' --repo '${{ github.repository }}' --pattern 'native-checksums.sha256' --dir 'artifacts/native/${{ matrix.rid }}'
            $restored = $LASTEXITCODE -eq 0
          }
          if ($restored) {
            $expected = (Get-Content 'artifacts/native/${{ matrix.rid }}/native-checksums.sha256' | Where-Object { $_ -match '  ${{ matrix.library }}$' }) -replace '  .+$', ''
            $actual = (Get-FileHash 'artifacts/native/${{ matrix.rid }}/${{ matrix.library }}' -Algorithm SHA256).Hash.ToLowerInvariant()
            $restored = $expected -eq $actual
          }
          "restored=$restored".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          exit 0
      - if: steps.native-release.outputs.restored != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.metadata.outputs.rust-toolchain }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - if: steps.native-release.outputs.restored != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ steps.metadata.outputs.rust-toolchain }}-${{ hashFiles('Cargo.lock', 'native/typst-dotnet-native/**/*.rs', 'native/typst-dotnet-native/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ steps.metadata.outputs.rust-toolchain }}-
      - if: steps.native-release.outputs.restored != 'true'
        run: cargo build --release --locked
      - shell: pwsh
        run: |
          if ('${{ steps.native-release.outputs.restored }}' -ne 'true') {
            Copy-Item "target/release/${{ matrix.library }}" "artifacts/native/${{ matrix.rid }}/${{ matrix.library }}"
          }
          $env:TYPST_NATIVE_LIBRARY = (Resolve-Path "artifacts/native/${{ matrix.rid }}/${{ matrix.library }}")
          dotnet test tests/Typst.Renderer.Tests/Typst.Renderer.Tests.csproj -c Release
      - shell: pwsh
        run: ./eng/pack-and-verify.ps1 -Rid ${{ matrix.rid }}
