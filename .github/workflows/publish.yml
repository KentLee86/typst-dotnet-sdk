name: publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned native release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content eng/native-release.json | ConvertFrom-Json
          $fingerprint = ./eng/native-fingerprint.ps1
          if ($fingerprint -ne $manifest.sourceFingerprint) {
            throw 'Native source changed without bumping the pinned native release.'
          }
          gh release view $manifest.tag --repo '${{ github.repository }}' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Pinned native release $($manifest.tag) does not exist." }

  publish:
    needs: verify
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download pinned native binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content eng/native-release.json | ConvertFrom-Json
          New-Item -ItemType Directory -Force artifacts/native/win-x64 | Out-Null
          New-Item -ItemType Directory -Force artifacts/native/linux-x64 | Out-Null
          gh release download $manifest.tag --repo '${{ github.repository }}' --pattern 'typst_dotnet_native.dll' --dir artifacts/native/win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download the pinned Windows native binary.' }
          gh release download $manifest.tag --repo '${{ github.repository }}' --pattern 'libtypst_dotnet_native.so' --dir artifacts/native/linux-x64
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download the pinned Linux native binary.' }
          gh release download $manifest.tag --repo '${{ github.repository }}' --pattern 'native-checksums.sha256' --dir artifacts/native
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download native checksums.' }
          foreach ($binary in @(
            'artifacts/native/win-x64/typst_dotnet_native.dll',
            'artifacts/native/linux-x64/libtypst_dotnet_native.so'
          )) {
            $name = Split-Path $binary -Leaf
            $expected = (Get-Content artifacts/native/native-checksums.sha256 | Where-Object { $_ -match "  $([regex]::Escape($name))$" }) -replace '  .+$', ''
            $actual = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "Checksum mismatch for $name." }
          }
      - name: Validate release version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $packageVersion = [string]$props.Project.PropertyGroup.Version
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion."
          }
      - name: Pack and verify Windows runtime
        shell: pwsh
        run: ./eng/pack-and-verify.ps1 -Rid win-x64
      - name: Pack and verify Linux runtime
        shell: pwsh
        run: ./eng/pack-and-verify.ps1 -Rid linux-x64
      - name: Exchange GitHub OIDC token for a NuGet API key
        uses: NuGet/login@v1
        id: nuget
        with:
          user: devcounsel
      - name: Publish packages to NuGet.org
        shell: pwsh
        run: |
          $packages = Get-ChildItem 'artifacts/packages' -Filter '*.nupkg' | Sort-Object Name
          if ($packages.Count -ne 9) { throw "Expected 9 packages, found $($packages.Count)." }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key '${{ steps.nuget.outputs.NUGET_API_KEY }}' `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish $($package.Name)." }
          }
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packages = @(Get-ChildItem 'artifacts/packages' -Filter '*.nupkg' | ForEach-Object FullName)
          gh release create '${{ github.ref_name }}' @packages `
            --repo '${{ github.repository }}' `
            --verify-tag `
            --generate-notes `
            --title 'Typst.Renderer ${{ github.ref_name }}'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
